[package]
name = "SeriousOrganizer-slint"
version = "0.1.0"
edition = "2024"

[dependencies]
# slint = "1.15.1"
slint = { version = "1.15.1", features = ["backend-winit", "renderer-skia"] }

serious_organizer_lib = { path = "../SeriousOrganizerLib" }
