[package]
name = "SeriousOrganizer-slint"
version = "0.1.0"
edition = "2024"

[dependencies]
slint = {
  version = "1.18.1",
  default-features = false,
  features = [
    "std",
    "backend-winit-wayland",
    "renderer-software",
    "compat-1-2"
  ]
}


serious_organizer_lib = { path = "../SeriousOrganizerLib" }
open = "5"

time = "0.3"

log = "0.4"
simplelog = "0.12"
directories = "6.0"

rfd = "0.18"

[build-dependencies]
slint-build = { version = "1.18.1" }

